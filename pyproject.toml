[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pal"
version = "0.1.0"
description = "Personal Agentic Librarian — CLI conversational companion"
requires-python = ">=3.12"
dependencies = [
    "agent_core @ git+https://github.com/EdibleTuber/agent_core.git@v1.2.1",
    "httpx>=0.27.0",
    "prompt-toolkit>=3.0.0",
    "rich>=13.0.0",
    "pyyaml>=6.0",
    "pymupdf4llm>=0.0.17",
]

[project.scripts]
pal = "pal.cli:main"
pal-daemon = "pal.daemon_main:main"
pal-discord = "pal.discord_main:main"
pal-backfill-titles = "pal.backfill_main:main"

[project.optional-dependencies]
discord = [
    "discord.py>=2.0",
]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "starlette>=0.37.0",
    "uvicorn[standard]>=0.29.0",
    "discord.py>=2.0",
]

[tool.hatch.metadata]
allow-direct-references = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
